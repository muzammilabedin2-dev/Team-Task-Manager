<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Team Task Manager</title>
  <meta name="description" content="Full-stack team task management with role-based access control">
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
</head>
<body>
  <!-- App is rendered entirely by JavaScript -->
  <div id="app-root">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;gap:16px;color:#64748b">
      <div style="width:40px;height:40px;border:2px solid #252a3a;border-top-color:#4f8ef7;border-radius:50%;animation:spin .7s linear infinite"></div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
      <p style="font-family:'DM Sans',sans-serif">Loading TaskFlow…</p>
    </div>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
